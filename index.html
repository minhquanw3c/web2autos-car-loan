<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<script src="https://cdn.tailwindcss.com"></script>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
		/>

		<!-- Import Vue 3 -->
		<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
		<!-- Import Pinia -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/vue-demi/0.14.6/index.iife.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/pinia/2.1.7/pinia.iife.js"></script>

		<!-- Import Element Plus CSS & JS -->

			rel="stylesheet"
			href="https://unpkg.com/element-plus/dist/index.css"
		/>
		<script src="https://unpkg.com/element-plus/dist/index.full.js"></script>

		<style>
			/* Shared Styles */
			body {
				background-color: #f3f4f6;
				font-family: "Helvetica Neue", Helvetica, "PingFang SC",
					"Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", Arial,
					sans-serif;
			}

			/* Overrides for Element Plus to match the desired look */
			.el-card {
				border-radius: 12px;
			}
			.el-dialog {
				border-radius: 16px;
				overflow: hidden;
			}
			.el-slider__button {
				border-color: #409eff;
			}

			/* Custom transitions */
			.fade-enter-active,
			.fade-leave-active {
				transition: opacity 0.3s;
			}

	</head>
	<body class="p-4 md:p-8">

			<!-- App content renders here -->

		<script>
			const { createApp, ref, computed, watch, reactive } = Vue;
			const { defineStore, createPinia } = Pinia;
			const { ElMessage } = ElementPlus;

			// ==========================================
			// 1. PINIA STORE
			// ==========================================
			const useLoanStore = defineStore("loan", () => {
				// -- App State --
				const currentView = ref("calculator");
				const selectedVehicle = ref(null);

				// -- Calculator State --
				const price = ref(20000);
				const downPayment = ref(1000);
				const tradeIn = ref(0);
				const amountOwed = ref(0);
				const interestRate = ref(7.0);
				const loanTerm = ref(24);

				// -- Mock Vehicle Data --
				const inventory = [
					{
						id: 1,
						make: "Toyota",
						model: "Camry SE",
						year: 2021,
						price: 24500,
						img: "https://placehold.co/600x400/1e293b/FFF?text=Toyota+Camry",

					{
						id: 2,
						make: "Honda",
						model: "Civic EX",
						year: 2022,
						price: 22000,
						img: "https://placehold.co/600x400/1e293b/FFF?text=Honda+Civic",

					},
					{
						id: 3,
						make: "Ford",
						model: "F-150 XL",
						year: 2020,
						price: 32000,

						make: "Chevrolet",

						desc: "Comfortable midsize sedan perfect for commuting.",
					},

						id: 5,
						make: "Nissan",
						model: "Altima",
						year: 2022,
						price: 23000,
						img: "https://placehold.co/600x400/1e293b/FFF?text=Nissan+Altima",
						desc: "Tech-forward sedan with AWD options.",

					{
						id: 6,
						make: "Hyundai",
						model: "Elantra",
						year: 2023,
						price: 21500,
						img: "https://placehold.co/600x400/1e293b/FFF?text=Hyundai+Elantra",
						desc: "Stylish design with excellent warranty coverage.",

					{
						id: 7,
						make: "BMW",
						model: "330i",
						year: 2019,
						price: 31000,
						img: "https://placehold.co/600x400/1e293b/FFF?text=BMW+3+Series",
						desc: "Luxury sports sedan with premium interior.",
					},
					{
						id: 8,
						make: "Kia",
						model: "K5",
						year: 2022,
						price: 25000,
						img: "https://placehold.co/600x400/1e293b/FFF?text=Kia+K5",
						desc: "Bold styling and turbo performance.",
					},
				];

				// -- Logic --
				watch(
					[price, downPayment, tradeIn, amountOwed, interestRate],
					([newPrice, newDown, newTrade, newOwed, newRate]) => {
						if (newPrice < 0) price.value = 0;
						if (newDown < 0) downPayment.value = 0;
						if (newTrade < 0) tradeIn.value = 0;
						if (newOwed < 0) amountOwed.value = 0;
						if (newRate < 0) interestRate.value = 0;
					}
				);

				const netTradeImpact = computed(
					() => (tradeIn.value || 0) - (amountOwed.value || 0)
				);

				const principal = computed(() => {
					let p =
						(price.value || 0) -
						(downPayment.value || 0) -
						netTradeImpact.value;
					return p > 0 ? p : 0;
				});

				const monthlyPayment = computed(() => {
					const A = downPayment.value || 0;
					const B = price.value || 0;
					const C = tradeIn.value || 0;
					const D = interestRate.value || 0;
					const G = amountOwed.value || 0;
					const H = loanTerm.value || 0;

					const principalAmount = B - A - C + G;
					if (principalAmount <= 0) return 0;
					if (D === 0) return principalAmount / H;

					const monthlyRate = D / 1200;
					const numerator = principalAmount * monthlyRate;
					const denominator = 1 - 1 / Math.pow(1 + monthlyRate, H);
					const payment = numerator / denominator;

					return isFinite(payment) ? payment : 0;
				});

				const recommendedVehicles = computed(() => {
					const targetPrice = price.value;
					return inventory.filter(
						(v) =>
							v.price >= targetPrice - 10000 &&
							v.price <= targetPrice + 10000
					);
				});

				const startApplication = () => {
					currentView.value = "application";
					window.scrollTo({ top: 0, behavior: "smooth" });
				};

				const resetView = () => {
					currentView.value = "calculator";
					selectedVehicle.value = null;
				};

				return {
					price,
					downPayment,
					tradeIn,
					amountOwed,
					interestRate,
					loanTerm,
					netTradeImpact,
					principal,
					monthlyPayment,
					recommendedVehicles,
					currentView,
					selectedVehicle,
					startApplication,
					resetView,
				};
			});

                        </div>

                            </div>
                            <el-select v-model="store.loanTerm" class="w-full" size="large" placeholder="Select Term">
                                <el-option v-for="opt in termOptions" :key="opt.value" :label="opt.label" :value="opt.value" />
                            </el-select>
                        </div>
                        <div class="space-y-1">
                            <div class="flex items-center mb-1">

                                <el-tooltip content="The amount offered for your old car." placement="top"><i class="fas fa-info-circle text-gray-400 cursor-help"></i></el-tooltip>

                            <el-input v-model.number="store.tradeIn" type="number" placeholder="0.00" size="large">
                                <template #prefix><i class="fas fa-dollar-sign text-gray-400"></i></template>
                            </el-input>
                        </div>
                        <div class="space-y-1">

                            </div>
                            <el-input v-model.number="store.amountOwed" type="number" placeholder="0.00" size="large">
                                <template #prefix><i class="fas fa-dollar-sign text-gray-400"></i></template>
                            </el-input>
                        </div>
                    </div>
                </el-card>`,
			};

										label: "Work Phone",
										type: "text",
										required: false,
									},
									{
										label: "Time of Current Employment",
										type: "text",
										required: true,
										format: "() years, () months",
										components: {
											year: { type: "number" },
											month: { type: "number" },
										},
									},
									{
										label: "Total Monthly Income or Annually",
										type: "number",
										required: true,
									},
								],
							},
							{
								heading: "Final details",
								inputs: [
									{
										label: "Ok to run credit reports by our top rated dealership",
										type: "checkbox",
										default: false,
									},
									{
										label: "How much of Down Payment?",
										type: "number",
										required: true,
									},
									{
										label: "I authorize this dealership to run my credit report.",
										type: "checkbox",
										default: false,
										required: true,
									},
									{
										label: "I agree to the collection and processing of my personal data.",
										type: "checkbox",
										default: false,
										required: true,
									},
									{
										label: "I agree to receive newsletters.",
										type: "checkbox",
										default: false,
										required: false,
									},
								],
							},
						],
					};

					// 2. State
					const formData = reactive({});
					const errors = reactive({}); // Error state
					const itemRefs = {}; // Store DOM refs for scrolling

					const usStates = [
						"AL",
						"AK",
						"AZ",
						"AR",
						"CA",
						"CO",
						"CT",
						"DE",
						"FL",
						"GA",
						"HI",
						"ID",
						"IL",
						"IN",
						"IA",
						"KS",
						"KY",
						"LA",
						"ME",
						"MD",
						"MA",
						"MI",
						"MN",
						"MS",
						"MO",
						"MT",
						"NE",
						"NV",
						"NH",
						"NJ",
						"NM",
						"NY",
						"NC",
						"ND",
						"OH",
						"OK",
						"OR",
						"PA",
						"RI",
						"SC",
						"SD",
						"TN",
						"TX",
						"UT",
						"VT",
						"VA",
						"WA",
						"WV",
						"WI",
						"WY",
					];
					const mockCities = [
						"New York",
						"Los Angeles",
						"Chicago",
						"Houston",
						"Phoenix",
						"Philadelphia",
						"San Antonio",
						"San Diego",
						"Dallas",
						"San Jose",
					];

					const generateKey = (groupHeading, label) => {
						const prefix = groupHeading
							.replace(/\s+/g, "")
							.toLowerCase();
						const suffix = label
							.replace(/[^a-zA-Z0-9]/g, "")
							.toLowerCase();
						return `${prefix}_${suffix}`;
					};

					// Function to set refs dynamically
					const setItemRef = (el, key) => {
						if (el) itemRefs[key] = el;
					};

					// Init State
					schema.groups.forEach((group) => {
						group.inputs.forEach((input) => {
							const key = generateKey(group.heading, input.label);
							if (input.components) {
								formData[key] = {};
								Object.keys(input.components).forEach(
									(compKey) => {
										formData[key][compKey] = "";
									}
								);
							} else {
								if (input.label.includes("Down Payment")) {
									formData[key] = store.downPayment;
								} else if (input.type === "checkbox") {
									formData[key] = input.default || false;
								} else {
									formData[key] = "";
								}
							}
						});
					});

					const resolveOptions = (optionsStr) => {
						if (Array.isArray(optionsStr)) return optionsStr;
						if (optionsStr === "US states") return usStates;
						if (optionsStr === "US cities") return mockCities;
						if (optionsStr && optionsStr.includes("..")) {
							const [start, end] = optionsStr
								.split("..")
								.map(Number);
							const arr = [];
							for (let i = start; i <= end; i++) arr.push(i);
							return arr;
						}
						return [];
					};

					const getResponsiveProps = (input) => {
						const l = input.label.toLowerCase();
						if (input.type === "checkbox") return { span: 24 };
						if (l === "current address" || l === "address")
							return { xs: 24, sm: 24, md: 24, lg: 24 };
						return { xs: 24, sm: 12, md: 12, lg: 8 };
					};

					const submitForm = () => {
						// 1. Clear previous errors
						Object.keys(errors).forEach(
							(key) => delete errors[key]
						);
						let firstErrorKey = null;

						// 2. Validate Loop
						schema.groups.forEach((group) => {
							group.inputs.forEach((input) => {
								const key = generateKey(
									group.heading,
									input.label
								);
								let errorMsg = null;

								// A. Required Check
								if (input.required) {
									if (input.components) {
										// Complex (Date/Duration): Check all parts
										const parts = formData[key];
										const missingPart = Object.values(
											parts
										).some((val) => !val);
										if (missingPart)
											errorMsg = `Please complete the ${input.label.toLowerCase()}.`;
									} else {
										// Standard
										const val = formData[key];
										if (!val && val !== 0) {
											if (input.type === "checkbox")
												errorMsg =
													"This field is required.";
											else
												errorMsg = `${input.label} is required.`;
										}
									}
								}

								// B. Email Check
								if (
									!errorMsg &&
									input.type === "email" &&
									formData[key]
								) {
									const emailRegex =
										/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
									if (!emailRegex.test(formData[key]))
										errorMsg =
											"Please enter a valid email address.";
								}

								// C. Collect Error
								if (errorMsg) {
									errors[key] = errorMsg;
									if (!firstErrorKey) firstErrorKey = key;
								}
							});
						});

						// 3. Result Action
						if (firstErrorKey) {
							// Scroll to first error
							const element = itemRefs[firstErrorKey];
							if (element && element.$el) {
								element.$el.scrollIntoView({
									behavior: "smooth",
									block: "center",
								});
							}
							ElMessage({
								message:
									"Please correct the errors highlighted below.",
								type: "error",
								duration: 3000,
							});
						} else {
							ElMessage({
								message:
									"Application Submitted! A consultant will contact you shortly.",
								type: "success",
								duration: 4000,
							});
							setTimeout(() => store.resetView(), 2000);
						}
					};

					return {
						store,
						formData,
						schema,
						errors,
						generateKey,
						resolveOptions,
						getResponsiveProps,
						submitForm,
						setItemRef,
					};
				},
				template: `
                <div class="max-w-5xl mx-auto my-4 md:my-8 animate-[fadeIn_0.5s_ease-out]">
                    <div class="flex justify-between items-center mb-6 px-2">
                        <div>
                             <h2 class="text-2xl md:text-3xl font-bold text-slate-800">{{ schema.formHeading }}</h2>
                             <p class="text-slate-500 mt-1 text-sm md:text-base">{{ schema.formDescription }}</p>
                        </div>
                        <el-button type="danger" circle @click="store.resetView"><i class="fas fa-times"></i></el-button>
                    </div>
                    
                    <el-form label-position="top" @submit.prevent="submitForm">
                        <div v-for="(group, gIndex) in schema.groups" :key="gIndex" class="mb-6">
                            <el-card shadow="hover" class="rounded-xl border-0 shadow-sm" :body-style="{ padding: '16px' }">
                                <template #header>
                                    <div class="flex items-center"><i class="fas fa-caret-right text-blue-500 mr-2"></i><span>{{ group.heading }}</span></div>
                                </template>
                                
                                <el-row :gutter="24">
                                    <el-col v-for="(input, iIndex) in group.inputs" :key="iIndex" v-bind="getResponsiveProps(input)">
                                        
                                        <!-- Checkbox Field -->
                                        <el-form-item 
                                            v-if="input.type === 'checkbox'" 
                                            class="mb-2" 
                                            :error="errors[generateKey(group.heading, input.label)]"
                                            :ref="(el) => setItemRef(el, generateKey(group.heading, input.label))"
                                        >
                                            <el-checkbox v-model="formData[generateKey(group.heading, input.label)]" :label="input.label" size="large" class="whitespace-normal h-auto py-2" />
                                        </el-form-item>

                                        <!-- Standard & Complex Fields -->
                                        <el-form-item 
                                            v-else 
                                            :label="input.label + (input.required ? ' *' : '')" 
                                            class="mb-6"
                                            :error="errors[generateKey(group.heading, input.label)]"
                                            :ref="(el) => setItemRef(el, generateKey(group.heading, input.label))"
                                        >
                                            <!-- Select -->
                                            <el-select v-if="input.type === 'select'" v-model="formData[generateKey(group.heading, input.label)]" placeholder="Select..." class="w-full">
                                                <el-option v-for="opt in resolveOptions(input.options)" :key="opt" :label="opt" :value="opt" />
                                            </el-select>
                                            
                                            <!-- Complex (Date/Duration) -->
                                            <div v-else-if="input.components" class="w-full flex gap-2">
                                                <div v-for="(compConfig, compKey) in input.components" :key="compKey" class="flex-1">
                                                    <el-select v-if="compConfig.type === 'select'" v-model="formData[generateKey(group.heading, input.label)][compKey]" :placeholder="compKey.toUpperCase()">
                                                        <el-option v-for="opt in resolveOptions(compConfig.options)" :key="opt" :label="opt" :value="opt" />
                                                    </el-select>
                                                    <el-input v-else v-model="formData[generateKey(group.heading, input.label)][compKey]" :placeholder="compKey" type="number" />
                                                </div>
                                            </div>
                                            
                                            <!-- Standard Text/Number -->
                                            <el-input v-else v-model="formData[generateKey(group.heading, input.label)]" :type="input.type === 'number' ? 'number' : (input.type === 'password' ? 'password' : 'text')" :placeholder="input.format || ''">
                                                <template #prefix v-if="input.label.includes('Price') || input.label.includes('Payment') || input.label.includes('Income')"><i class="fas fa-dollar-sign"></i></template>
                                            </el-input>
                                        </el-form-item>

                                    </el-col>
                                </el-row>
                            </el-card>
                        </div>
                        <div class="flex flex-col-reverse md:flex-row justify-end gap-4 mt-8 pb-10">
                            <el-button size="large" @click="store.resetView" class="w-full md:w-auto">Cancel</el-button>
                            <el-button type="primary" size="large" native-type="submit" class="!px-8 !text-lg w-full md:w-auto">Submit Application <i class="fas fa-paper-plane ml-2"></i></el-button>
                        </div>
                    </el-form>
                </div>`,
			};

			// ==========================================
			// 4. MAIN APP
			// ==========================================
			const App = {
				components: {
					LoanInputSection,
					LoanSummary,
					VehicleGrid,
					VehicleModal,
					ConsultantForm,
				},
				setup() {
					const store = useLoanStore();
					return { store };
				},
				template: `
                <div class="space-y-6">
                    <transition name="fade" mode="out-in">
                        <div v-if="store.currentView === 'calculator'" key="calc">
                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                <div class="lg:col-span-2 order-1">
                                    <loan-input-section></loan-input-section>
                                </div>
                                <div class="lg:col-span-1 order-2 lg:order-2">
                                    <div class="lg:sticky lg:top-4">
                                        <loan-summary></loan-summary>
                                        <el-alert title="Tip" type="info" description="Click on any vehicle to view details and apply." show-icon :closable="false" class="mt-6 hidden lg:flex" />
                                    </div>
                                </div>
                                <div class="lg:col-span-3 order-3">
                                    <vehicle-grid></vehicle-grid>
                                </div>
                            </div>
                            <vehicle-modal></vehicle-modal>
                        </div>
                        <div v-else-if="store.currentView === 'application'" key="app">
                             <consultant-form></consultant-form>
                        </div>
                    </transition>
                </div>
            `,
			};

			const pinia = createPinia();
			const app = createApp(App);
			app.use(ElementPlus);
			app.use(pinia);
			app.mount("#app");
		</script>
	</body>
</html>
